# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: classroom
    main: .
    binary: classroom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/4rjxn/classroom/internal/utils.GOOGLE_CLIENT_ID={{ .Env.GOOGLE_CLIENT_ID }}
      - -X github.com/4rjxn/classroom/internal/utils.GOOGLE_CLIENT_SECRET={{ .Env.GOOGLE_CLIENT_SECRET }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: 4rjxn
    name: classroom

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
